name: rag-end-to-end

services:
  postgres:
    # Postgres + pgvector: child chunk embeddings live in a vector table,
    # parent documents in a plain key-value table.
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgweb:
    # Browser SQL client for poking at the parent/child tables.
    # Bound to loopback: pgweb has no auth, so it must not be exposed off-box.
    image: sosedoff/pgweb:0.17.0
    container_name: rag-pgweb
    restart: unless-stopped
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}?sslmode=disable
    ports:
      - "127.0.0.1:${PGWEB_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
